# DriveMate thresholds: every threshold, weight, cooldown and window lives here.
# Each owner edits only their own section (core: lead, cv: CV, voice: Voice & LLM, ui: Frontend).
# Values are starting points from docs/requirements.md, to calibrate on Saturday.
# Load with backend.config.load_config(); DRIVEMATE_PROFILE=demo applies profiles.demo on top.
# A profile may only override keys that already exist below (typos fail at load time).

core:
  vehicle:
    rate_hz: 10                    # DB-02
    # UAH-DriveSet replay (LEAD-T08); layout and units in docs/datasets.md.
    data_dir: data/UAH-DRIVESET-v1
    trips:
      normal: D1/20151111123124-25km-D1-NORMAL-MOTORWAY
      drowsy: D2/20151120135152-25km-D2-DROWSY-MOTORWAY
      aggressive: D5/20151209153137-25km-D5-AGGRESSIVE-MOTORWAY
    default_trip: normal
    gps_lag_s: 0.75                # GPS speed drop trails braking peaks by ~0.75 s (docs/datasets.md)
    loop: true                     # restart the trip at its end
  alerts:
    llm_timeout_s: 2.0             # AL-05, NF-02
    t1_min_interval_s: 300         # AL-02: at most one T1 prompt per 5 min
    noncritical_min_interval_s: 120  # AL-02: at most one non-critical prompt per 2 min
    listen_s: 8                    # VR-02: listening window after the alert ends
    reply_grace_s: 3               # LEAD-T10: no reply within listen_s + 3 s
    max_repeats: 1                 # VR-05: repeat once, then escalate a tier
    slow_reply_s: 3                # VR-07: two slow replies in a row raise fatigue
    music_duck_volume: 20          # 0-100 while speaking and listening (T1, T2)
    t3_music_level: 0.0            # T3: music muted (tier table, requirements section 4)
    speak_max_s: 15                # longest wait for voice to finish speaking before counting
    voice_gap_s: 0.5               # pause before the next voice.say: voice drops non-T3 while busy
    default_lang: en               # until control.trip sets the driver's language
  rage:
    trigger_score: 60              # RR-05
    firm_score: 85                 # RR-05: firmer message, suggest pulling over
    min_modalities: 2              # RR-05: 2 of 3 (face, voice, driving) must agree
    face_alone_s: 5                # RR-05
    harsh_g: 0.4                   # RR-04
    harsh_window_s: 60             # RR-04
    cooldown_s: 180                # RR-07
    max_per_window: 3              # RR-07
    max_window_s: 1800             # RR-07
    weights: {face: 0.4, voice: 0.35, driving: 0.25}
  zoning:
    threshold: 0.6
    monotony_speed_kmh: 70         # ZO-01
    monotony_spread_kmh: 5         # LEAD-T19
    monotony_window_s: 600         # ZO-01: 10 min
    engagement_interval_s: 300     # ZO-05
    max_engagements: 3             # ZO-05
    engagement_window_s: 1800      # ZO-05
    weights: {visual: 0.7, monotony: 0.3}
  checkin:
    base_interval_min: 30          # CI-02
    short_sleep_h: 6               # CI-02
    high_tiredness: 4              # CI-02
    circadian_factor: 0.66         # CI-02
    circadian_dips: ["00:00-06:00", "14:00-16:00"]
    min_interval_min: 10           # CI-02
    max_interval_min: 45           # CI-02
    break_every_min: 120           # CI-03
    break_risk_min: 105            # CI-03
    event_lookback_min: 15         # CI-04
    event_shorten: 0.30            # CI-04
    quiet_min: 30                  # CI-04
    quiet_lengthen: 0.20           # CI-04
  crash:
    spike_g: 4.0                   # CR-01
    stop_speed_kmh: 5              # CR-01
    stop_within_s: 10              # CR-01
    countdown_s: 20                # CR-02
  hr:
    stress_delta_bpm: 30           # SW-03
    stress_hold_s: 60              # SW-03
    fatigue_drop: 0.10             # SW-03
  inject:
    harsh_brake_g: -0.6            # LEAD-T09
    harsh_brake_s: 1.5
    crash_g: 5.0
    crash_spike_s: 0.2             # how long the crash spike lasts
    crash_stop_s: 3                # speed ramps to 0 within this, then stays 0 (CR-01)
  fake:                            # core --fake (LEAD-T06): synthetic drive and alert cycle
    alert_every_s: 15
    speak_s: 3
    speed_kmh: 100
    lang: en

cv:
  # camera / publisher / fake / face_landmarks: from the cv/cp0 branch (CV owner's layout).
  camera:
    index: 1                       # USB HTI-UC320 on the demo laptop
    max_index: 10
    capture_width: 1280
    capture_height: 720
    capture_fourcc: MJPG
    process_width: 640
    process_height: 360
  publisher:
    state_rate_hz: 10
    broker_url: ws://localhost:8765/bus
  fake:
    sequence: all
  face_landmarks:
    model_path: models/face_landmarker.task
    num_faces: 1
    detection_confidence: 0.5
    presence_confidence: 0.5
    tracking_confidence: 0.5
    pitch_sign: -1.0
  eye_state:
    model_path: models/eye_state.onnx
    closed_probability_threshold: 0.5
    use_ear_fallback: true
    ear_closed_threshold: 0.18
    ear_open_threshold: 0.23
    crop_padding_fraction: 0.25
    input_size: 64
    training_validation_fraction: 0.2
    training_seed: 42
    max_model_size_bytes: 5000000
    max_inference_ms_per_eye: 3.0
  preview:
    rate_hz: 15
    width: 320
    jpeg_quality: 80
    draw_landmarks: false
  # Detection thresholds seeded from docs/requirements.md by the lead; CV owner tunes them.
  min_fps: 15                      # CV-01
  frame_rate_hz: 5                 # camera.frame
  frame_width_px: 320
  frame_overlay: true
  perclos_window_s: 60             # CV-05
  gaze_window_s: 30                # CV-05
  blink_window_s: 60               # CV-05
  yawn_window_s: 600               # CV-05
  yawn_fallback:
    rate_hz: 10
    score_threshold: 0.65
    mouth_aspect_threshold: 0.55
    hold_s: 0.8
    cooldown_s: 2.5
  anger_fallback:
    rate_hz: 5
    smoothing_alpha: 0.2
    weights_brow: 0.35
    weights_mouth: 0.45
    weights_nose: 0.2
  anger_model:
    model_path: models/trained/emotion.pt
    rate_hz: 5
    smoothing_alpha: 0.2
  activity_models:
    models_dir: models/trained
    rate_hz: 5
    distraction_threshold: 0.5
    drowsiness_threshold: 0.5
    phone_threshold: 0.5
  zoning:
    window_s: 60
    gaze_dispersion_deg: 2.0
    population_blink_rate_pm: 18
    low_blink_ratio: 0.6
    head_movement_deg: 8
    weights: {gaze: 0.45, blink: 0.25, head: 0.30}
  no_face_notice_s: 2              # CV-06
  no_face_warning_s: 5             # CV-06
  eyes_off_yaw_deg: 30             # DD-01
  eyes_off_pitch_deg: -20          # DD-01
  eyes_off_s: 2                    # DD-01
  microsleep_s: 1.0                # DD-02
  perclos_threshold: 0.15          # DD-03
  yawn_count: 3                    # DD-03
  visual_events:
    cooldown_s: 30                 # CV-T10: suppress rapid repeat episodes of the same type
  anger_threshold: 0.6             # RR-01
  anger_hold_s: 3                  # RR-01
  phone_hold_s: 1.5                # PH-02
  zoning_stare_s: 60               # ZO-01

voice:
  # null uses the system default. Use an index from --list-devices to override.
  input_device: null
  output_device: null
  ring_buffer_s: 10
  cabin_baseline_s: 60
  cabin_shout_db: 15
  cabin_shout_s: 1.0  # Set to 0.5 for the demo.

ui:
  accel_window_s: 60               # DB-02
  harsh_marker_g: 0.4              # DB-02
  form_lock_speed_kmh: 5           # CI-06, NF-07

profiles:
  # 5-minute demo: effects must show within a minute or so.
  demo:
    core:
      alerts:
        t1_min_interval_s: 60
        noncritical_min_interval_s: 30
      rage:
        cooldown_s: 60
        max_window_s: 300
      zoning:
        monotony_window_s: 60      # LEAD-T19: 60 s in the demo profile
        engagement_interval_s: 60
        engagement_window_s: 300
      checkin:
        base_interval_min: 3
        min_interval_min: 1
        max_interval_min: 5
        break_every_min: 5
        break_risk_min: 4
        event_lookback_min: 2
        quiet_min: 3
    cv:
      perclos_window_s: 30         # DD-03: show within 60 s in demo mode
      yawn_window_s: 120
      zoning_stare_s: 30           # ZO-01: fixed stare for 30 s in demo mode
      zoning:
        window_s: 30
