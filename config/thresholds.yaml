# DriveMate thresholds: every threshold, weight, cooldown and window lives here.
# Each owner edits only their own section (core: lead, cv: CV, voice: Voice & LLM, ui: Frontend).
# Values are starting points from docs/requirements.md, to calibrate on Saturday.
# Load with backend.config.load_config(); DRIVEMATE_PROFILE=demo applies profiles.demo on top.
# A profile may only override keys that already exist below (typos fail at load time).

core:
  vehicle:
    rate_hz: 10                    # DB-02
    # UAH-DriveSet replay (LEAD-T08); layout and units in docs/datasets.md.
    data_dir: data/UAH-DRIVESET-v1
    trips:
      normal: D1/20151111123124-25km-D1-NORMAL-MOTORWAY
      drowsy: D2/20151120135152-25km-D2-DROWSY-MOTORWAY
      aggressive: D5/20151209153137-25km-D5-AGGRESSIVE-MOTORWAY
    default_trip: normal
    gps_lag_s: 0.75                # GPS speed drop trails braking peaks by ~0.75 s (docs/datasets.md)
    loop: true                     # restart the trip at its end
    park_until_trip: true          # CI-06: stand at 0 km/h until control.trip start (demo step 2)
  alerts:
    llm_timeout_s: 2.0             # AL-05, NF-02
    t1_min_interval_s: 300         # AL-02: at most one T1 prompt per 5 min
    noncritical_min_interval_s: 120  # AL-02: at most one non-critical prompt per 2 min
    listen_s: 8                    # VR-02: listening window after the alert ends
    reply_grace_s: 6               # brief says 3 s; live voice replies came up to 5 s late (17:14 demo)
    max_repeats: 1                 # VR-05: repeat once, then escalate a tier
    slow_reply_s: 3                # VR-07: two slow replies in a row raise fatigue
    music_duck_volume: 20          # 0-100 while speaking and listening (T1, T2)
    t3_music_level: 0.0            # T3: music muted (tier table, requirements section 4)
    duck_level:                    # per type, overrides music_duck_volume (0-1)
      road_rage: 0.7               # RR-06: lower the music by 30%, then speak
    speak_max_s: 15                # longest wait for voice to finish speaking before counting
    voice_gap_s: 2.0               # pause before the next voice.say (alarm rounds, repeats, next alert); voice drops non-T3 while busy
    alarm_audio_key: alarm         # VR-05: assets/audio/alarm.wav, played by voice instead of speech
    alarm_rounds: 5                # VR-05: alarm rounds after a T3 miss, until the driver answers
    default_lang: en               # English-only runtime
    cooldown_s:                    # LEAD-T14: per type, from one accepted alert to the next
      distraction: 60
      phone: 60
      no_face: 60
      drowsiness: 300              # a break was already suggested; do not nag
      zoning_out: 300              # ZO-05: at most one engagement per 5 min
      road_rage: 180               # RR-07
  rage:
    trigger_score: 60              # RR-05
    publish_hz: 2                  # rage.score for the dashboard's rage meter
    firm_score: 85                 # RR-05: firmer message, suggest pulling over
    min_modalities: 2              # RR-05: 2 of 3 (face, voice, driving) must agree
    face_alone_s: 5                # RR-05
    harsh_g: 0.4                   # RR-04
    harsh_window_s: 60             # RR-04
    cooldown_s: 180                # RR-07
    max_per_window: 3              # RR-07
    max_window_s: 1800             # RR-07
    weights: {face: 0.4, voice: 0.35, driving: 0.25}
    face_threshold: 0.7            # RR-01: anger_p counts as angry from here (laptop camera: neutral face ~0.44)
    face_hold_s: 3                 # RR-01: sustained this long, the face modality agrees
    voice_window_s: 10             # a shout or swear keeps the voice modality agreeing this long
    swears_full: 3                 # swears in 60 s that give the full voice component
    hr_bonus: 10                   # SW-03 stress cue adds this many points
    music_bonus: 5                 # music turned up by music_rise within music_window_s
    music_rise: 20
    music_window_s: 30
    resting_hr: 70                 # until the pre-trip form gives the driver's own (CI-01)
  zoning:
    threshold: 0.6
    monotony_speed_kmh: 70         # ZO-01
    monotony_spread_kmh: 5         # LEAD-T19
    monotony_window_s: 600         # ZO-01: 10 min
    engagement_interval_s: 300     # ZO-05
    max_engagements: 3             # ZO-05
    engagement_window_s: 1800      # ZO-05
    weights: {visual: 0.7, monotony: 0.3}
    feedback_question: "How are you feeling now?"  # ZO-04 feedback ends with a question (VR-01)
    trivia_topics: [geography, space, animals, food, music, sport, history, science, cars,
                    inventions, movies, the human body, oceans, famous buildings, languages]
  checkin:
    base_interval_min: 30          # CI-02
    short_sleep_h: 6               # CI-02
    high_tiredness: 4              # CI-02
    circadian_factor: 0.66         # CI-02
    circadian_dips: ["00:00-06:00", "14:00-16:00"]
    min_interval_min: 10           # CI-02
    max_interval_min: 45           # CI-02
    break_every_min: 120           # CI-03
    break_risk_min: 105            # CI-03
    event_lookback_min: 15         # CI-04
    event_shorten: 0.30            # CI-04
    quiet_min: 30                  # CI-04
    quiet_lengthen: 0.20           # CI-04
    retry_s: 30                    # LEAD-T20: a check-in held back by AL-02 tries again after this
  crash:
    spike_g: 4.0                   # CR-01
    stop_speed_kmh: 5              # CR-01
    stop_within_s: 10              # CR-01
    countdown_s: 20                # CR-02
  hr:
    stress_delta_bpm: 30           # SW-03
    stress_hold_s: 60              # SW-03
    fatigue_drop: 0.10             # SW-03
  inject:
    harsh_brake_g: -0.6            # LEAD-T09
    harsh_brake_s: 1.5
    crash_g: 5.0
    crash_spike_s: 0.2             # how long the crash spike lasts
    crash_stop_s: 3                # speed ramps to 0 within this, then stays 0 (CR-01)
  routing:                         # LEAD-T15: CV detector.event type -> alert tier
    tiers:
      distraction: T2              # DD-01
      microsleep: T3               # DD-02
      drowsiness: T2               # DD-03 (with a break suggestion)
      phone: T2                    # PH-02
      no_face: T2                  # CV-06
    cancels:                       # DD-04: tired drivers get a break, not a game
      drowsiness: [zoning_out]
      microsleep: [zoning_out]
    fusion_tiers:                  # core's own detector.event types (LEAD-T17/T18/T22)
      road_rage: T2
      crash_candidate: T3          # CR-02
    max_words:                     # tighter than the LLM's own 25-word check
      road_rage: 20                # RR-06
    firm_variant:                  # template variant for firm messages (RR-05, score >= 85)
      road_rage: 3                 # "If you need a breather, can you pull over somewhere safe?"
  triplog:                         # LEAD-T12, AL-04: one JSONL file per trip, kept local
    dir: logs
    topics: [detector.event, alert.state, voice.say, voice.status, voice.reply, control.music,
             control.trip, control.inject, control.replay, checkin.schedule, trip.summary]
  fake:                            # core --fake (LEAD-T06): synthetic drive and alert cycle
    alert_every_s: 15
    speak_s: 3
    speed_kmh: 100
    lang: en

cv:
  # camera / publisher / fake / face_landmarks: from the cv/cp0 branch (CV owner's layout).
  camera:
    index: 0                       # built-in MacBook camera; USB HTI-UC320: --camera 1
    max_index: 10
    capture_width: 1280
    capture_height: 720
    capture_fourcc: MJPG
    process_width: 640
    process_height: 360
  publisher:
    state_rate_hz: 10
    broker_url: ws://localhost:8765/bus
  fake:
    sequence: all
  face_landmarks:
    model_path: models/face_landmarker.task
    num_faces: 1
    detection_confidence: 0.5
    presence_confidence: 0.5
    tracking_confidence: 0.5
    pitch_sign: -1.0
  eye_state:
    model_path: models/eye_state.onnx
    closed_probability_threshold: 0.4  # DD-02 (lowered 22 Nov: closed eyes were missed on the laptop camera)
    use_ear_fallback: true
    ear_closed_threshold: 0.18
    ear_open_threshold: 0.23
    crop_padding_fraction: 0.25
    input_size: 64
    training_validation_fraction: 0.2
    training_seed: 42
    max_model_size_bytes: 5000000
    max_inference_ms_per_eye: 3.0
  preview:
    rate_hz: 15
    width: 320
    jpeg_quality: 80
    draw_landmarks: false
  # Detection thresholds seeded from docs/requirements.md by the lead; CV owner tunes them.
  min_fps: 15                      # CV-01
  frame_rate_hz: 5                 # camera.frame
  frame_width_px: 320
  frame_overlay: true
  perclos_window_s: 60             # CV-05
  gaze_window_s: 30                # CV-05
  blink_window_s: 60               # CV-05
  yawn_window_s: 600               # CV-05
  yawn_fallback:
    rate_hz: 10
    score_threshold: 0.65
    mouth_aspect_threshold: 0.55
    hold_s: 0.8
    cooldown_s: 2.5
  anger_fallback:
    rate_hz: 5
    smoothing_alpha: 0.2
    weights_brow: 0.35
    weights_mouth: 0.45
    weights_nose: 0.2
  anger_model:
    model_path: models/trained/emotion.pt
    rate_hz: 5
    smoothing_alpha: 0.2
  activity_models:
    models_dir: models/trained
    rate_hz: 5
    distraction_threshold: 0.5
    drowsiness_threshold: 0.65     # DD-03: model probability (raised 22 Nov: fewer false drowsiness alerts)
    phone_threshold: 0.5
    yawn_blend_weight: 0.5         # DD-03: yawn score = (1-w) * blendshape + w * activity model
    eye_closed_blend_weight: 0.3   # DD-02: eye_closed_p = (1-w) * eye-state model + w * activity model
    blink_threshold: 0.5           # activity-model blink starts here
    blink_rearm_threshold: 0.3     # and ends below this
  zoning:
    window_s: 60
    gaze_dispersion_deg: 2.0
    population_blink_rate_pm: 18
    low_blink_ratio: 0.6
    head_movement_deg: 8
    weights: {gaze: 0.45, blink: 0.25, head: 0.30}
  no_face_notice_s: 2              # CV-06
  no_face_warning_s: 5             # CV-06
  eyes_off_yaw_deg: 20             # DD-01 (lowered 22 Nov for the laptop camera)
  eyes_off_pitch_deg: -15          # DD-01 (lowered 22 Nov for the laptop camera)
  eyes_off_s: 2                    # DD-01
  microsleep_s: 1.0                # DD-02
  perclos_threshold: 0.15          # DD-03
  yawn_count: 3                    # DD-03
  visual_events:
    cooldown_s: 30                 # CV-T10: suppress rapid repeat episodes of the same type
  anger_threshold: 0.7             # RR-01 (raised 22 Nov: neutral face reads ~0.44 on the laptop camera)
  anger_hold_s: 3                  # RR-01
  phone_hold_s: 1.5                # PH-02
  zoning_stare_s: 60               # ZO-01

voice:
  # null uses the system default. Use an index from --list-devices to override.
  input_device: null
  output_device: null
  ring_buffer_s: 10
  reply_timeout_s: 1.5
  cabin_baseline_s: 60
  cabin_shout_db: 15
  cabin_shout_s: 1.0  # Set to 0.5 for the demo.

ui:
  crash_countdown_s: 20            # CR-02; keep aligned with core.crash.countdown_s
  accel_window_s: 60               # DB-02
  harsh_marker_g: 0.4              # DB-02
  form_lock_speed_kmh: 5           # CI-06, NF-07
  attention:
    score_formula: "100 - 100 * weighted_sum(normalized drowsiness, distraction, rage, zoning risks)"
    weights: {drowsiness: 0.35, distraction: 0.30, rage: 0.20, zoning: 0.15}
    perclos_full_risk: 0.15        # DD-03
    yaw_full_risk_deg: 30          # DD-01
    pitch_down_full_risk_deg: 20   # DD-01
    gaze_dispersion_full_risk_deg: 30
    yawns_full_risk: 3             # DD-03
    anger_cue_threshold: 0.5       # DB-04
    music_rise_delta: 10            # volume points within cue_window_s
    music_low_volume: 25            # volume points
    zoning_cue_threshold: 0.6
    cue_window_s: 30                # DB-04

profiles:
  # 5-minute demo: effects must show within a minute or so.
  demo:
    voice:
      reply_timeout_s: 2.5
    core:
      alerts:
        t1_min_interval_s: 60
        noncritical_min_interval_s: 30
        cooldown_s:
          distraction: 20
          phone: 20
          no_face: 20
          drowsiness: 60
          zoning_out: 60
          road_rage: 60
      rage:
        cooldown_s: 60
        max_window_s: 300
      zoning:
        monotony_window_s: 60      # LEAD-T19: 60 s in the demo profile
        weights: {visual: 1.0, monotony: 0.3}  # ZO-01: a 30 s stare alone crosses the threshold
        engagement_interval_s: 60
        engagement_window_s: 300
      # Check-ins keep their real values: demo step 1 shows "every 15 min, break at 1:45"
      # (5 h sleep), and none should interrupt steps 2-6 (LEAD-T21).
    cv:
      perclos_window_s: 30         # DD-03: show within 60 s in demo mode
      yawn_window_s: 120
      zoning_stare_s: 30           # ZO-01: fixed stare for 30 s in demo mode
      zoning:
        window_s: 30
