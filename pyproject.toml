[project]
name = "drivemate"
version = "0.1.0"
description = "Voice-first driver-safety copilot (CodeLap 2026)"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dashboard", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
